# =========================================================================
# Nginx interno del contenedor del frontend
# Sirve la SPA compilada por Vite. No hace de reverse proxy hacia el
# backend: de eso se encarga el proxy externo (NPM) en produccion.
# =========================================================================

server {
    # Puerto 8080 y no 80: Nginx corre como usuario sin privilegios y los
    # puertos por debajo de 1024 requieren root.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No revelar la version de Nginx en las cabeceras de respuesta.
    server_tokens off;

    # --- Cabeceras de seguridad -----------------------------------------
    # Complementan a las que envia Spring Security en las respuestas de la
    # API: estas protegen la entrega del HTML y los estaticos.

    # La aplicacion no debe poder incrustarse en un iframe (clickjacking).
    add_header X-Frame-Options "DENY" always;

    # Impide que el navegador adivine el tipo de contenido.
    add_header X-Content-Type-Options "nosniff" always;

    # Limita la informacion de origen que se filtra al navegar fuera.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Sin acceso a camara, microfono ni geolocalizacion: no se usan.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP. 'unsafe-inline' en estilos es necesario porque MUI inyecta CSS en
    # linea mediante Emotion. connect-src permite las llamadas a la API y el
    # WebSocket de notificaciones.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # --- Compresion ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Estaticos con hash en el nombre ---------------------------------
    # Vite renombra estos archivos en cada build, asi que pueden cachearse
    # indefinidamente sin riesgo de servir una version obsoleta.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Enrutado de la SPA ----------------------------------------------
    # React Router maneja las rutas en el cliente: cualquier ruta
    # desconocida devuelve index.html en lugar de un 404.
    location / {
        try_files $uri $uri/ /index.html;

        # index.html nunca se cachea: es quien apunta a los bundles nuevos
        # tras cada despliegue.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Ocultar archivos que empiecen por punto.
    location ~ /\. {
        deny all;
        return 404;
    }
}
