# =========================================================================
# CONFIGURACION BASE (perfil por defecto: desarrollo)
# =========================================================================
# NINGUN SECRETO SE ESCRIBE EN ESTE ARCHIVO.
# Todos los valores sensibles se leen de variables de entorno (.env).
# La sintaxis ${VARIABLE} sin valor por defecto falla el arranque si la
# variable no existe: es intencional, evita desplegar con credenciales
# de ejemplo sin darse cuenta.
# =========================================================================

spring.application.name=sistema-tickets

# --- Conexion a PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'validate': Hibernate comprueba que el esquema coincide con las entidades,
# pero NO lo modifica. El esquema lo gobierna Flyway, y solo Flyway.
#
# Antes estaba en 'update', lo que dejaba a dos herramientas tocando el mismo
# esquema. Ademas de pisarse entre si, 'update' oculta los errores: si una
# migracion olvida una columna, Hibernate la crea en silencio y el fallo no
# aparece hasta desplegar en un entorno donde no este activo. Con 'validate' el
# arranque falla de inmediato y se ve que falta.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# SQL en consola: util en desarrollo, desactivado en prod para no filtrar datos.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---
# El versionado del esquema esta activo. V1 es el baseline tomado del volcado
# real de produccion.
#
# baseline-on-migrate=true con baseline-version=1 hace que, sobre una base de
# datos que YA existe, Flyway marque la V1 como aplicada sin ejecutarla y solo
# corra de la V2 en adelante. Sobre una base vacia, la V1 crea el esquema
# completo (usa IF NOT EXISTS, asi que es segura en ambos casos).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Impide borrar el esquema por accidente desde la aplicacion.
spring.flyway.clean-disabled=true

# --- Seguridad / JWT ---
# Clave HMAC en Base64. Validada al arranque por JwtSecretValidator.
app.jwt.secret=${APP_JWT_SECRET}
# Vigencia del access token en ms (1 hora, segun el estandar).
app.jwt.expiration=${APP_JWT_EXPIRATION:3600000}

# --- CORS ---
# Origenes permitidos separados por coma. Los consume WebConfig.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Paginacion ---
# 10 registros por pagina, resueltos en la base de datos con LIMIT/OFFSET.
spring.data.web.pageable.default-page-size=10
# Techo por peticion: impide que un cliente pida ?size=100000 y fuerce al
# servidor a materializar la tabla entera.
spring.data.web.pageable.max-page-size=100
# La primera pagina es la 0, como espera Spring Data.
spring.data.web.pageable.one-indexed-parameters=false

# --- Rate limiting (anti fuerza bruta en /auth/login) ---
app.rate-limit.enabled=true
app.rate-limit.capacity=5
app.rate-limit.refill-minutes=1

# --- Zona horaria ---
# Los tickets, resguardos y reparaciones deben guardarse en hora local, no en
# UTC: de lo contrario las fechas de vencimiento se desplazan varias horas.
# El Dockerfile ya fija TZ en el contenedor; esto cubre la ejecucion local.
spring.jackson.time-zone=America/Mexico_City
app.zona-horaria=America/Mexico_City

# --- Resguardos ---
# Revision diaria de vencimientos: marca como VENCIDO todo prestamo cuya
# fecha haya pasado y siga ENTREGADO. Expresion cron: 06:00 cada dia.
app.resguardos.revision-vencimientos-cron=0 0 6 * * *
# Dias de antelacion con los que se avisa de un vencimiento proximo.
app.resguardos.dias-aviso-previo=7

# --- Bot de Telegram ---
telegram.bot.username=${TELEGRAM_BOT_USERNAME}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:false}

# --- Servidor ---
server.port=8080
# Necesario para que el rate limiting vea la IP real detras del reverse proxy.
server.forward-headers-strategy=framework

# No exponer detalles internos en las respuestas de error.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
