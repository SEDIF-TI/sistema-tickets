# =========================================================================
# PERFIL 'prod' — se activa con SPRING_PROFILES_ACTIVE=prod
# =========================================================================
# Solo contiene las diferencias respecto a application.properties.
# Aqui tampoco hay secretos: siguen llegando por variables de entorno.
# =========================================================================

# --- JPA / Hibernate ---
# CRITICO: en produccion Hibernate NUNCA modifica el esquema.
# 'validate' solo comprueba que las entidades cuadren con las tablas.
# Los cambios de esquema entran unicamente por migraciones Flyway.
spring.jpa.hibernate.ddl-auto=validate

# Nada de SQL en los logs: filtraria datos de usuarios y tickets.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway ---
# En produccion el versionado del esquema es obligatorio.
# Requiere haber generado antes V1__baseline.sql desde el esquema real.
spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true
# Impide que una migracion ya aplicada se modifique silenciosamente.
spring.flyway.clean-disabled=true

# --- Logging ---
# Sin DEBUG en produccion: ruido y riesgo de filtrar datos sensibles.
logging.level.root=WARN
logging.level.com.sedif.sistema_tickets=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# --- Errores ---
# Cero detalle interno hacia el cliente.
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never

# --- Servidor ---
# Detras del reverse proxy (Nginx Proxy Manager): respeta X-Forwarded-*
# para que el rate limiting reciba la IP real del cliente y no la del proxy.
server.forward-headers-strategy=framework
# No revelar el servidor de aplicaciones en las cabeceras.
server.server-header=

# --- Rate limiting ---
# Mas estricto que en desarrollo.
app.rate-limit.enabled=true
app.rate-limit.capacity=5
app.rate-limit.refill-minutes=5
